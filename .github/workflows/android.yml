name: Audio Studio Main Gate

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK bootstrap
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: SDK + NDK + CMake
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Host DSP smoke — freestanding headers only
        run: |
          CORE_CFLAGS="-std=c11 -O2 -ffreestanding -fno-builtin -nostdinc -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-common -Wall -Wextra -Werror -Iapp/src/main/cpp"
          clang $CORE_CFLAGS native/tests/dsp_smoke.c app/src/main/cpp/dsp_core.c -o dsp_smoke
          ./dsp_smoke

      - name: Host meter smoke — freestanding headers only
        run: |
          CORE_CFLAGS="-std=c11 -O2 -ffreestanding -fno-builtin -nostdinc -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-common -Wall -Wextra -Werror -Iapp/src/main/cpp"
          clang $CORE_CFLAGS native/tests/meter_smoke.c app/src/main/cpp/meter_core.c -o meter_smoke
          ./meter_smoke

      - name: Host manifold smoke — wave matrix buffer container
        run: |
          CORE_CFLAGS="-std=c11 -O2 -ffreestanding -fno-builtin -nostdinc -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-common -Wall -Wextra -Werror -Iapp/src/main/cpp"
          clang $CORE_CFLAGS native/tests/manifold_smoke.c \
            app/src/main/cpp/rfa_wave_core.c \
            app/src/main/cpp/rfa_matrix_core.c \
            app/src/main/cpp/rfa_block_core.c \
            app/src/main/cpp/rfa_container_core.c \
            app/src/main/cpp/rfa_fir_core.c \
            app/src/main/cpp/rfa_time_core.c \
            app/src/main/cpp/rfa_lms_core.c \
            app/src/main/cpp/rfa_biquad_core.c \
            -o manifold_smoke
          ./manifold_smoke

      - name: Authorial freestanding source gate
        run: |
          CORE_C="app/src/main/cpp/dsp_core.c app/src/main/cpp/meter_core.c app/src/main/cpp/rfa_wave_core.c app/src/main/cpp/rfa_matrix_core.c app/src/main/cpp/rfa_block_core.c app/src/main/cpp/rfa_container_core.c app/src/main/cpp/rfa_fir_core.c app/src/main/cpp/rfa_time_core.c app/src/main/cpp/rfa_lms_core.c app/src/main/cpp/rfa_biquad_core.c"
          CORE_ALL="$CORE_C app/src/main/cpp/dsp_core.h app/src/main/cpp/meter_core.h app/src/main/cpp/rfa_wave_core.h app/src/main/cpp/rfa_matrix_core.h app/src/main/cpp/rfa_block_core.h app/src/main/cpp/rfa_container_core.h app/src/main/cpp/rfa_fir_core.h app/src/main/cpp/rfa_time_core.h app/src/main/cpp/rfa_lms_core.h app/src/main/cpp/rfa_biquad_core.h app/src/main/cpp/rfa_core_types.h"

          if grep -nRE '^[[:space:]]*#include[[:space:]]*<' $CORE_ALL; then
            echo "System header reached the freestanding core"
            exit 1
          fi

          if grep -nRE '\b(malloc|calloc|realloc|free|memcpy|memmove|memset|memcmp|printf|fprintf|snprintf|puts|open|close|read|write|sqrt|pow|log|exp|sin|cos|tan)[[:space:]]*\(' $CORE_C; then
            echo "Forbidden hosted/runtime dependency in freestanding core"
            exit 1
          fi

          if grep -nP '^\s*static\s+(?!const\b)[^({]*;' $CORE_C; then
            echo "Mutable file-scope state is forbidden in freestanding core"
            exit 1
          fi

      - name: ARMv7 zero-undefined + ABI surface
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          FLAGS="-std=c11 -O3 -ffreestanding -fno-builtin -nostdinc -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-common -fvisibility=hidden -ffunction-sections -fdata-sections -Wall -Wextra -Werror -Iapp/src/main/cpp"

          for SRC in dsp_core meter_core rfa_wave_core rfa_matrix_core rfa_block_core rfa_container_core rfa_fir_core rfa_time_core rfa_lms_core rfa_biquad_core; do
            "$CC" --target=armv7a-linux-androideabi29 $FLAGS -c "app/src/main/cpp/$SRC.c" -o "$SRC.armv7.o"
            "$NM" -u "$SRC.armv7.o" > "$SRC.armv7.undefined"
            if test -s "$SRC.armv7.undefined"; then
              cat "$SRC.armv7.undefined"
              exit 1
            fi
          done

          : > abi.actual
          for SRC in dsp_core meter_core rfa_wave_core rfa_matrix_core rfa_block_core rfa_container_core rfa_fir_core rfa_time_core rfa_lms_core rfa_biquad_core; do
            "$NM" --defined-only --extern-only "$SRC.armv7.o" | awk -v src="$SRC" '{print src ":" $NF}' >> abi.actual
          done
          sort -o abi.actual abi.actual
          grep -v '^[[:space:]]*#' native/abi/public_symbols_v1.txt | grep -v '^[[:space:]]*
      - name: AArch64 zero-undefined
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          FLAGS="-std=c11 -O3 -ffreestanding -fno-builtin -nostdinc -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-common -fvisibility=hidden -ffunction-sections -fdata-sections -Wall -Wextra -Werror -Iapp/src/main/cpp"

          for SRC in dsp_core meter_core rfa_wave_core rfa_matrix_core rfa_block_core rfa_container_core rfa_fir_core rfa_time_core rfa_lms_core rfa_biquad_core; do
            "$CC" --target=aarch64-linux-android29 $FLAGS -c "app/src/main/cpp/$SRC.c" -o "$SRC.aarch64.o"
            "$NM" -u "$SRC.aarch64.o" > "$SRC.aarch64.undefined"
            if test -s "$SRC.aarch64.undefined"; then
              cat "$SRC.aarch64.undefined"
              exit 1
            fi
          done

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rafaelia-audio-studio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
 | sort > abi.expected
          diff -u abi.expected abi.actual

      - name: AArch64 zero-undefined
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          FLAGS="-std=c11 -O3 -ffreestanding -fno-builtin -nostdinc -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-common -fvisibility=hidden -ffunction-sections -fdata-sections -Wall -Wextra -Werror -Iapp/src/main/cpp"

          for SRC in dsp_core meter_core rfa_wave_core rfa_matrix_core rfa_block_core rfa_container_core rfa_fir_core rfa_time_core rfa_lms_core rfa_biquad_core; do
            "$CC" --target=aarch64-linux-android29 $FLAGS -c "app/src/main/cpp/$SRC.c" -o "$SRC.aarch64.o"
            "$NM" -u "$SRC.aarch64.o" > "$SRC.aarch64.undefined"
            if test -s "$SRC.aarch64.undefined"; then
              cat "$SRC.aarch64.undefined"
              exit 1
            fi
          done

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rafaelia-audio-studio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
