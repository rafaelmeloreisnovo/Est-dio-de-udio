name: Rafaelia Audio START

run-name: Rafaelia Audio · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Delivery mode after the quality gate.
        required: true
        default: validate
        type: choice
        options:
          - validate
          - live-debug
          - provider-bootstrap
          - signed-release
          - store-internal
          - store-production
      source_sha:
        description: Optional exact 40-char source SHA; blank uses the selected ref SHA.
        required: false
        type: string

# Stable per-PR/per-main identity: new commits evict stale queued/in-progress work.
# Deliberate owner-initiated deliveries are never silently cancelled.
concurrency:
  group: rafaelia-audio-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  plan:
    name: 00 · plan / route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.route.outputs.source_sha }}
      delivery: ${{ steps.route.outputs.delivery }}
      validation_lane: ${{ steps.route.outputs.validation_lane }}
    steps:
      - name: Resolve exact source and delivery route
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              source_sha="$PR_HEAD_SHA"
              delivery="validate"
              # Draft development is intentionally host-only: never claim APK PASS.
              # GitHub ready_for_review explicitly triggers the full binary gate.
              if test "$PR_DRAFT" = true; then
                validation_lane="fast"
              else
                validation_lane="full"
              fi
              ;;
            push)
              source_sha="$EVENT_SHA"
              delivery="validate"
              validation_lane="full"
              ;;
            workflow_dispatch)
              source_sha="$REQUESTED_SHA"
              if test -z "$source_sha"; then source_sha="$EVENT_SHA"; fi
              delivery="${REQUESTED_MODE:-validate}"
              validation_lane="full"
              ;;
            *)
              echo "UNSUPPORTED_EVENT=$EVENT_NAME"
              exit 1
              ;;
          esac

          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SOURCE_SHA_INVALID=$source_sha"
            exit 1
          fi

          case "$delivery" in
            validate|live-debug|provider-bootstrap|signed-release|store-internal|store-production) ;;
            *)
              echo "DELIVERY_MODE_INVALID=$delivery"
              exit 1
              ;;
          esac

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "delivery=$delivery" >> "$GITHUB_OUTPUT"
          echo "validation_lane=$validation_lane" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$source_sha"
          echo "DELIVERY_MODE=$delivery"
          echo "VALIDATION_LANE=$validation_lane"
          echo "FULL_BINARY_VALIDATION=$([[ "$validation_lane" = full ]] && echo REQUIRED || echo NOT_RUN)"
          echo "EXTERNAL_STANDARD_AUDIT=NOT_AUDITED"

  quick:
    name: gate / quick (source + host; NOT APK)
    if: ${{ needs.plan.outputs.validation_lane == 'fast' && github.event_name == 'pull_request' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      RFA_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
    steps:
      - name: Exact source checkout (no marketplace actions)
        shell: bash
        env:
          RFA_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$RFA_GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$RFA_SOURCE_SHA"
          unset auth
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$RFA_SOURCE_SHA"
      - name: Fast host/source gates (no SDK, Gradle or APK build)
        shell: bash
        run: bash ci/rafaelia-fast-gate.sh
      - name: Explicit partial evidence receipt
        if: ${{ always() }}
        shell: bash
        run: |
          echo "CI_LANE=FAST_SOURCE_HOST_ONLY"
          echo "CI_SOURCE_SHA=$RFA_SOURCE_SHA"
          echo "APK_BUILT=NOT_RUN"
          echo "APK_INSTALLABLE=NOT_RUN"
          echo "PHYSICAL_DEVICE=NOT_RUN"
          echo "RELEASE_ELIGIBLE=false"
          echo "REQUIRED_FULL_GATE=gate / build on ready_for_review/main/manual validate"

  gate:
    name: gate / build
    # Full exact-head artifact gate stays mandatory before merge/release.
    if: ${{ needs.plan.outputs.validation_lane == 'full' && needs.plan.outputs.delivery != 'provider-bootstrap' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RFA_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      RFA_CI_RUN_ID: ${{ github.run_id }}
      RFA_CI_RUN_NUMBER: ${{ github.run_number }}
      RFA_SIGNING_MODE: DEBUG_NONAUTHORIAL
      RFA_SIGNER_ID: UNAVAILABLE_DEBUG_BUILD
      RFA_EXPECTED_CERT_SHA256: TOKEN_VAZIO
    steps:
      - name: 10 · exact checkout
        shell: bash
        env:
          RFA_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$RFA_GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$RFA_SOURCE_SHA"
          unset auth
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$RFA_SOURCE_SHA"
          echo "RAFAELIA_CHECKOUT=PASS"

      - name: 12 · deterministic Android revision
        shell: bash
        run: bash ci/rafaelia-version.sh

      - name: 20 · capacity bootstrap
        shell: bash
        run: bash ci/rafaelia-pipeline.sh bootstrap

      - name: 30 · single-root topology
        shell: bash
        run: bash ci/rafaelia-pipeline.sh topology

      - name: 40 · quality capability
        shell: bash
        run: bash ci/rafaelia-pipeline.sh quality

      - name: 41 · distribution / update contract
        shell: bash
        run: bash ci/distribution-contract-gate.sh

      - name: 42 · explicit compile / Java + native ABIs
        shell: bash
        run: bash ci/compile-debug-gate.sh

      - name: 45 · parser fuzz / ARM runtime regression
        shell: bash
        run: |
          bash ci/parser-fuzz-asan.sh
          bash ci/freestanding-runtime-gate.sh

      - name: 50 · architecture / ABI
        shell: bash
        run: bash ci/rafaelia-pipeline.sh architecture

      - name: 60 · evidence preparation
        shell: bash
        run: bash ci/rafaelia-pipeline.sh evidence

      - name: 70 · deterministic debug build
        shell: bash
        run: bash ci/rafaelia-pipeline.sh build-debug

      - name: 72 · exact-byte reproducibility / same pinned CI environment
        shell: bash
        run: bash ci/reproducible-debug-gate.sh

      - name: 75 · static APK installability
        shell: bash
        run: bash ci/apk-installability-static.sh app/build/outputs/apk/debug/app-debug.apk

      - name: 80 · binary receipt
        shell: bash
        run: bash ci/rafaelia-pipeline.sh binary-receipt

      - name: 99 · scoped summary
        if: ${{ always() }}
        shell: bash
        run: bash ci/rafaelia-pipeline.sh summary

  provider_observe:
    name: 04 · provider / verify main
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [plan, gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Observe main policy without privileged PAT
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "${{ needs.gate.result }}" = success || {
            echo "::error::BUILD_GATE_NOT_PASS"; exit 1;
          }
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          protected="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected')"
          echo "PROVIDER_SOURCE_SHA=$EXPECTED_SOURCE"
          echo "PROVIDER_LIVE_MAIN_SHA=$current_sha"
          echo "PROVIDER_MAIN_PROTECTED=$protected"
          test "$current_sha" = "$EXPECTED_SOURCE" || {
            echo "::error::MAIN_SHA_MOVED — exact-head protection cannot be claimed"; exit 1;
          }
          test "$protected" = true || {
            echo "::error::P0_MAIN_UNPROTECTED — use owner-only provider-bootstrap after configuring PAT_ENVIRONMENTS"; exit 1;
          }
          echo "PROVIDER_PROTECTED_FLAG=OBSERVED"
          echo "REQUIRED_CHECK_CONTEXT=TOKEN_VAZIO_UNTIL_ADMIN_READBACK"

  provider_bootstrap:
    name: 05 · provider / bootstrap (owner-only manual)
    # Manual provider-bootstrap deliberately skips the build gate; always() is
    # required to evaluate this job when its dependency gate is skipped.
    if: ${{ always() && needs.plan.result == 'success' && needs.gate.result == 'skipped' && github.event_name == 'workflow_dispatch' && github.actor == 'rafaelmeloreisnovo' && github.ref == 'refs/heads/main' && needs.plan.outputs.delivery == 'provider-bootstrap' }}
    needs:
      - plan
      - gate
    runs-on: ubuntu-latest
    # Configure this GitHub Environment with required approval/restricted main ref.
    # The source declaration alone DOES NOT prove provider reviewer enforcement.
    environment:
      name: provider-admin
    permissions:
      contents: read
    env:
      RFA_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      RFA_PROVIDER_ADMIN_TOKEN: ${{ secrets.PAT_ENVIRONMENTS }}
    steps:
      - name: Exact checkout for provider bootstrap
        shell: bash
        env:
          RFA_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$RFA_GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$RFA_SOURCE_SHA"
          unset auth
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$RFA_SOURCE_SHA"
      - name: Apply non-delete provider governance
        shell: bash
        run: bash ci/provider-bootstrap.sh

  deliver_live:
    name: 90 · delivery / live-debug
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'rafaelmeloreisnovo' && needs.plan.outputs.delivery == 'live-debug' }}
    needs:
      - plan
      - gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RFA_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      RFA_CI_RUN_ID: ${{ github.run_id }}
      RFA_CI_RUN_NUMBER: ${{ github.run_number }}
      RFA_SIGNING_MODE: DEBUG_NONAUTHORIAL
      RFA_SIGNER_ID: UNAVAILABLE_DEBUG_BUILD
      RFA_EXPECTED_CERT_SHA256: TOKEN_VAZIO
    steps:
      - name: Exact checkout after green gate
        shell: bash
        env:
          RFA_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$RFA_GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$RFA_SOURCE_SHA"
          unset auth
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$RFA_SOURCE_SHA"

      - name: Bind deterministic Android revision
        shell: bash
        run: bash ci/rafaelia-version.sh

      - name: Build capability bootstrap
        shell: bash
        run: bash ci/rafaelia-pipeline.sh bootstrap

      - name: Re-materialize provenance for delivered binary
        shell: bash
        run: bash ci/rafaelia-pipeline.sh evidence

      - name: Build exact debug binary
        shell: bash
        run: bash ci/rafaelia-pipeline.sh build-debug

      - name: Verify exact debug build reproducibility
        shell: bash
        run: bash ci/reproducible-debug-gate.sh

      - name: Verify exact debug binary installability
        shell: bash
        run: bash ci/apk-installability-static.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Bind binary receipt
        shell: bash
        run: bash ci/rafaelia-pipeline.sh binary-receipt

      - name: Publish traceable prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/rafaelia-pipeline.sh publish-live

  deliver_signed:
    name: 90 · delivery / signed + store
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'rafaelmeloreisnovo' && github.ref == 'refs/heads/main' && (needs.plan.outputs.delivery == 'signed-release' || needs.plan.outputs.delivery == 'store-internal' || needs.plan.outputs.delivery == 'store-production') }}
    needs:
      - plan
      - gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RFA_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      RFA_CI_RUN_ID: ${{ github.run_id }}
      RFA_CI_RUN_NUMBER: ${{ github.run_number }}
      RFA_DELIVERY_MODE: ${{ needs.plan.outputs.delivery }}
      RFA_PROVIDER_REF: ${{ github.ref }}
      RFA_PROVIDER_REF_PROTECTED: ${{ github.ref_protected }}
      RFA_PROVIDER_REF_SHA: ${{ github.sha }}
      RFA_SIGNING_MODE: AUTHORIAL_ANDROID_APKSIGNER
      RFA_SIGNER_ID: ${{ vars.RAFAELIA_SIGNER_ID }}
      RFA_EXPECTED_CERT_SHA256: ${{ vars.RAFAELIA_EXPECTED_CERT_SHA256 }}
      RFA_ANDROID_KEY_ALIAS: ${{ vars.RAFAELIA_ANDROID_KEY_ALIAS }}
      RFA_ANDROID_KEYSTORE_B64: ${{ secrets.RAFAELIA_ANDROID_KEYSTORE_B64 }}
      RFA_ANDROID_STORE_PASSWORD: ${{ secrets.RAFAELIA_ANDROID_STORE_PASSWORD }}
      RFA_ANDROID_KEY_PASSWORD: ${{ secrets.RAFAELIA_ANDROID_KEY_PASSWORD }}
      RFA_PAGES_REPO: ${{ vars.RAFAELIA_PAGES_REPO }}
      RFA_PAGES_PAT: ${{ secrets.RAFAELIA_PAGES_PAT }}
      RFA_PLAY_SERVICE_ACCOUNT_B64: ${{ secrets.RAFAELIA_PLAY_SERVICE_ACCOUNT_B64 }}
      RFA_PLAY_PACKAGE_NAME: ${{ vars.RAFAELIA_PLAY_PACKAGE_NAME }}
      RFA_PLAY_PRODUCTION_APPROVED: ${{ vars.RAFAELIA_PLAY_PRODUCTION_APPROVED }}
    steps:
      - name: Provider enforcement gate
        shell: bash
        run: bash ci/provider-enforcement-gate.sh

      - name: Exact checkout after green gate
        shell: bash
        env:
          RFA_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$RFA_GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$RFA_SOURCE_SHA"
          unset auth
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$RFA_SOURCE_SHA"

      - name: Bind deterministic Android revision
        shell: bash
        run: bash ci/rafaelia-version.sh

      - name: Signing capability bootstrap
        shell: bash
        run: bash ci/rafaelia-pipeline.sh bootstrap

      - name: Build, sign, publish Pages and optional Play track
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/distribution-release.sh
