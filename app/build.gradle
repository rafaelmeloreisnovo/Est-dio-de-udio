plugins {
    id 'com.android.application'
}

android {
    namespace 'io.rafaelia.audiostudio'
    compileSdk 35

    defaultConfig {
        applicationId 'io.rafaelia.audiostudio'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0-delta1'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cFlags '-std=c11 -O3'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
