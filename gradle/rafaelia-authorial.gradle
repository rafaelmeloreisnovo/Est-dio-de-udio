/*
 * RAFAELIA authorial Gradle task surface.
 * This file does not replace the Android Gradle Plugin; it defines the
 * project-owned task names and ordering used by CI and local development.
 */

def assuranceSmokeOut = layout.buildDirectory.dir("rafaelia-assurance-smoke")

tasks.register("rafaeliaAssuranceModelSmoke") {
    group = "rafaelia verification"
    description = "Run pure-Java fail-closed qualification vectors for the ZIPRAF assurance model."
    doLast {
        def outDir = assuranceSmokeOut.get().asFile
        delete(outDir)
        outDir.mkdirs()
        exec {
            commandLine "javac", "-d", outDir.absolutePath,
                    "src/main/java/io/rafaelia/audiostudio/AssurancePipelineModel.java",
                    rootProject.file("native/tests/AssurancePipelineSmoke.java").absolutePath
        }
        exec {
            commandLine "java", "-cp", outDir.absolutePath,
                    "io.rafaelia.audiostudio.AssurancePipelineSmoke"
        }
    }
}

tasks.register("rafaeliaSensorPermissionGate") {
    group = "rafaelia verification"
    description = "Fail closed on Android permission, step/activity and sensor-rate regressions."
    doLast {
        exec {
            commandLine "bash", rootProject.file("ci/sensor-permission-gate.sh").absolutePath
        }
    }
}

tasks.register("rafaeliaJavaGate") {
    group = "rafaelia verification"
    description = "Compile the Android Java edge early and fail before full APK work."
    dependsOn("rafaeliaAssuranceModelSmoke")
    dependsOn("rafaeliaSensorPermissionGate")
    dependsOn("compileDebugJavaWithJavac")
}

tasks.register("rafaeliaDebugApk") {
    group = "rafaelia build"
    description = "Build the canonical debug APK with R8/resource shrinking disabled."
    dependsOn("assembleDebug")
}

tasks.register("rafaeliaLowApk") {
    group = "rafaelia build"
    description = "Build the explicit lowDebug profile."
    dependsOn("assembleLowDebug")
}

tasks.register("rafaeliaBuildContract") {
    group = "rafaelia verification"
    description = "Print the canonical build boundary for receipts."
    doLast {
        println("RAFAELIA_BUILD_CONTRACT=V1")
        println("JAVA_EDGE=ANDROID_PLATFORM_ONLY")
        println("C_CORE=FREESTANDING")
        println("R8=OFF")
        println("RESOURCE_SHRINK=OFF")
        println("ABIS=armeabi-v7a,arm64-v8a")
        println("ASSURANCE_ZIPRAF=FAIL_CLOSED_MODEL_V1")
        println("SENSOR_PERMISSION_GATE=BOUND_TO_JAVA_GATE")
        println("EXTERNAL_STANDARD_AUDIT=NOT_AUDITED")
    }
}
